version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: careerpilot_postgres
    restart: always
    environment:
      POSTGRES_USER: careerpilot
      POSTGRES_PASSWORD: careerpilot123
      POSTGRES_DB: careerpilot_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: careerpilot_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
